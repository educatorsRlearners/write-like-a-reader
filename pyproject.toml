[project]
name = "write-like-a-reader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.0",
    "ollama>=0.4",
    "pysbd>=0.3.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Cloud providers are opt-in; the default "ollama" provider needs none of these.
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
deepseek = ["openai>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
